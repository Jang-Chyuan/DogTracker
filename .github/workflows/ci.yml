name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Rebuild and release main on demand, for when a push produced no run at all:
  # GitHub skips a whole workflow when the head commit message carries the
  # skip-ci marker, and a squash merge inherits the body of the commits it
  # squashes, so a pull request that merely writes about that marker is enough.
  workflow_dispatch:

concurrency:
  # Supersede an outdated PR run, but never cancel a main build and lose its APK.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest
        # The npm script already passes node --experimental-sqlite;
        # --runInBand keeps parallel workers off the same SQLite files.
        run: npm test -- --runInBand

      - name: ESLint
        # No --max-warnings: src/mapHistory/HistorySettings.js has two existing
        # react-native/no-inline-styles warnings, and only errors should fail CI.
        run: npx eslint src __tests__ App.js

  release-apk:
    name: Build release APK
    needs: checks
    # Build on push/merge to main and on a manual run; a pull request just runs
    # the checks above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The patch number counts the commits on main, so this job needs the
          # whole history, not the single commit a default checkout brings.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        # Read the versions out of android/build.gradle rather than keeping a
        # second copy here that silently goes stale.
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          # grep -m1 rather than grep | head -1: under pipefail, grep taking
          # SIGPIPE from head fails the whole step.
          read_ext() { grep -oPm1 "^\s*$1\s*=\s*\"?\K[^\"[:space:]]+" android/build.gradle; }
          compile_sdk="$(read_ext compileSdkVersion)"
          build_tools="$(read_ext buildToolsVersion)"
          ndk="$(read_ext ndkVersion)"
          echo "platforms;android-$compile_sdk / build-tools;$build_tools / ndk;$ndk"
          # Same trap, so not yes | sdkmanager: feed it a fixed number of y's.
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 50))"
          # From API 37 the platform packages carry a minor version
          # (platforms;android-37.0); API 36 and earlier do not. Try the plain id
          # first, then the .0 one, instead of hard-coding either shape.
          platform=""
          for candidate in "platforms;android-$compile_sdk" "platforms;android-$compile_sdk.0"; do
            if "$sdkmanager" "$candidate"; then
              platform="$candidate"
              break
            fi
            echo "$candidate is not in the SDK repository, trying the next candidate."
          done
          if [ -z "$platform" ]; then
            echo "No platform package found for compileSdk $compile_sdk" >&2
            exit 1
          fi
          echo "Using $platform"
          "$sdkmanager" "build-tools;$build_tools" "ndk;$ndk"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        # MAJOR.MINOR comes from package.json and the patch is the number of
        # commits on main, which rises on its own with every merge. Nothing has
        # to be committed back to the repository to move the version along.
        # To open a new MAJOR or MINOR line, edit package.json in a pull request.
        id: version
        run: |
          set -euo pipefail
          base="$(node -e '
            const version = require("./package.json").version;
            const parsed = /^(\d+)\.(\d+)\./.exec(version);
            if (!parsed) {
              console.error(`package.json version is not MAJOR.MINOR.PATCH: ${version}`);
              process.exit(1);
            }
            console.log(`${parsed[1]}.${parsed[2]}`);
          ')"
          count="$(git rev-list --count HEAD)"
          if [ "$count" -lt 2 ]; then
            echo "history holds only $count commit(s); the checkout needs fetch-depth: 0" >&2
            exit 1
          fi
          echo "releasing $base.$count (versionCode $count)"
          echo "name=$base.$count" >> "$GITHUB_OUTPUT"
          echo "code=$count" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        # Without the GOOGLE_MAPS_ANDROID_API_KEY secret the build still
        # succeeds, but BuildConfig.GOOGLE_MAPS_CONFIGURED stays false and the
        # in-app map is unusable. Note that a run created before the secret
        # existed keeps an empty value for its whole life.
        working-directory: android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the single file as is, so the download is
          # app-release.apk itself rather than a zip to unpack on a phone. The
          # artifact is then named after the file and the name input is ignored.
          archive: false
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        # A direct .apk link a phone can open, without signing in to GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset="DogTracker-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$asset"
          # Release notes are user-facing copy, so they stay in Chinese.
          notes="$(printf '%s\n' \
            "由 GitHub Actions 自動建置，commit \`$GITHUB_SHA\`：" \
            "" \
            "> $(git log -1 --pretty=%s)" \
            "" \
            "簽章使用 repo 內的 debug keystore，僅供內部測試，不可上架。" \
            "手機安裝前可能需要允許「安裝未知來源的應用程式」。")"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "DogTracker v$VERSION" \
              --notes "$notes"
          fi
