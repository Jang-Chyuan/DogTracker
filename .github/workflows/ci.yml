name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Supersede an outdated PR run, but never cancel a main build and lose its APK.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest
        # The npm script already passes node --experimental-sqlite;
        # --runInBand keeps parallel workers off the same SQLite files.
        run: npm test -- --runInBand

      - name: ESLint
        # No --max-warnings: src/mapHistory/HistorySettings.js has two existing
        # react-native/no-inline-styles warnings, and only errors should fail CI.
        run: npx eslint src __tests__ App.js

  release-apk:
    name: Build release APK
    needs: checks
    # Build only on push/merge to main; a pull request just runs the checks above.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        # Read the versions out of android/build.gradle rather than keeping a
        # second copy here that silently goes stale.
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager not found at $sdkmanager" >&2
            exit 1
          fi
          # grep -m1 rather than grep | head -1: under pipefail, grep taking
          # SIGPIPE from head fails the whole step.
          read_ext() { grep -oPm1 "^\s*$1\s*=\s*\"?\K[^\"[:space:]]+" android/build.gradle; }
          compile_sdk="$(read_ext compileSdkVersion)"
          build_tools="$(read_ext buildToolsVersion)"
          ndk="$(read_ext ndkVersion)"
          echo "platforms;android-$compile_sdk / build-tools;$build_tools / ndk;$ndk"
          # Same trap, so not yes | sdkmanager: feed it a fixed number of y's.
          "$sdkmanager" --licenses > /dev/null <<< "$(printf 'y\n%.0s' $(seq 50))"
          # From API 37 the platform packages carry a minor version
          # (platforms;android-37.0); API 36 and earlier do not. Try the plain id
          # first, then the .0 one, instead of hard-coding either shape.
          platform=""
          for candidate in "platforms;android-$compile_sdk" "platforms;android-$compile_sdk.0"; do
            if "$sdkmanager" "$candidate"; then
              platform="$candidate"
              break
            fi
            echo "$candidate is not in the SDK repository, trying the next candidate."
          done
          if [ -z "$platform" ]; then
            echo "No platform package found for compileSdk $compile_sdk" >&2
            exit 1
          fi
          echo "Using $platform"
          "$sdkmanager" "build-tools;$build_tools" "ndk;$ndk"

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        # CI owns the version: each main build takes the next patch of whatever
        # main currently holds, tags it, and writes it back at the end. Reading
        # from origin/main rather than the checked-out commit keeps two merges
        # landing close together from resolving to the same version.
        id: version
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          current="$(git show origin/main:package.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          next="$(node -e '
            const current = process.argv[1];
            const parsed = /^(\d+)\.(\d+)\.(\d+)$/.exec(current);
            if (!parsed) {
              console.error(`version on main is not MAJOR.MINOR.PATCH: ${current}`);
              process.exit(1);
            }
            console.log(`${parsed[1]}.${parsed[2]}.${Number(parsed[3]) + 1}`);
          ' "$current")"
          echo "$current on main -> releasing $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        # Without the GOOGLE_MAPS_ANDROID_API_KEY secret the build still
        # succeeds, but BuildConfig.GOOGLE_MAPS_CONFIGURED stays false and the
        # in-app map is unusable. Note that a run created before the secret
        # existed keeps an empty value for its whole life.
        working-directory: android
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          APP_VERSION_NAME: ${{ steps.version.outputs.next }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the single file as is, so the download is
          # app-release.apk itself rather than a zip to unpack on a phone. The
          # artifact is then named after the file and the name input is ignored.
          archive: false
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        # A direct .apk link a phone can open, without signing in to GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          asset="DogTracker-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$asset"
          # Release notes are user-facing copy, so they stay in Chinese.
          notes="$(printf '%s\n' \
            "由 GitHub Actions 自動建置，commit \`$GITHUB_SHA\`：" \
            "" \
            "> $(git log -1 --pretty=%s)" \
            "" \
            "簽章使用 repo 內的 debug keystore，僅供內部測試，不可上架。" \
            "手機安裝前可能需要允許「安裝未知來源的應用程式」。")"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "DogTracker v$VERSION" \
              --notes "$notes"
          fi

      - name: Record the released version on main
        # Only after the release exists, so a failed build never bumps anything.
        # The commit is built on origin/main rather than on the commit that was
        # checked out, so it never conflicts with a merge that landed meanwhile.
        # A push made with GITHUB_TOKEN does not trigger workflows; [skip ci] is
        # belt and braces in case this ever runs with a different token.
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -B version-bump origin/main
            npm version "$VERSION" --no-git-tag-version --allow-same-version > /dev/null
            if git diff --quiet -- package.json package-lock.json; then
              echo "main already records $VERSION, nothing to push."
              exit 0
            fi
            git commit -qam "chore(release): v$VERSION [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved while building, retrying ($attempt of 3)"
          done
          echo "Could not record v$VERSION on main" >&2
          exit 1
