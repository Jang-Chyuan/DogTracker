apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// The key stays in the build environment or ignored android/local.properties.
// JavaScript receives only the configured flag, never the credential itself.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }
def googleMapsApiKey = (System.getenv('GOOGLE_MAPS_ANDROID_API_KEY') ?: localProperties.getProperty('GOOGLE_MAPS_ANDROID_API_KEY', '')).trim()

// Local builds and CI use the same full-history commit count. Explicit
// APP_VERSION_NAME / APP_VERSION_CODE overrides must be supplied together.
def resolvedAppVersion = new groovy.json.JsonSlurper().parseText(
        providers.exec {
            workingDir rootProject.file('..')
            commandLine 'node', 'scripts/app-version.js'
        }.standardOutput.asText.get())

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.dogtracker"
    defaultConfig {
        applicationId "com.dogtracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedAppVersion.code as int
        versionName resolvedAppVersion.name
        manifestPlaceholders.googleMapsApiKey = googleMapsApiKey
        buildConfigField 'boolean', 'GOOGLE_MAPS_CONFIGURED', (!googleMapsApiKey.isEmpty()).toString()
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    // org.json is a stub in local unit tests; the real one for AlertCodec.
    testImplementation("org.json:json:20240303")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.work:work-runtime-ktx:2.10.5")
    implementation("androidx.core:core-splashscreen:1.2.0")
    // uCrop (react-native-image-crop-picker's cropper) is published on JitPack
    // with an empty POM, so its androidx.transition use is never pulled in:
    // UCropActivity.setupViews -> NoClassDefFoundError AutoTransition (070).
    implementation("androidx.transition:transition:1.5.0")
    // The history export draws its PNG map on a lite-mode Google map (HistoryExportPackage.kt);
    // the same Maps SDK react-native-maps already brings.
    implementation("com.google.android.gms:play-services-maps:19.1.0")
    // 067: fused location for the phone recorder (the version react-native-maps uses).
    implementation("com.google.android.gms:play-services-location:21.3.0")
    def cameraxVersion = "1.5.0"
    implementation("androidx.camera:camera-camera2:${cameraxVersion}")
    implementation("androidx.camera:camera-lifecycle:${cameraxVersion}")
    implementation("androidx.camera:camera-view:${cameraxVersion}")
    implementation("androidx.camera:camera-mlkit-vision:${cameraxVersion}")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// JVM alert tests use the same XML defaults as Android. No second copy deck.
def nativeCopyOutput = layout.buildDirectory.dir('generated/source/nativeCopy')
def generateNativeCopy = tasks.register('generateNativeCopy') {
    def copyXml = file('src/main/res/values/strings.xml')
    inputs.file(copyXml)
    outputs.dir(nativeCopyOutput)
    doLast {
        def entries = new groovy.xml.XmlParser().parse(copyXml).string.collect { row ->
            def value = row.text()
            if (value.startsWith('"') && value.endsWith('"')) value = value.substring(1, value.length() - 1)
            value = value.replace('\\n', '\n').replace("\\'", "'").replace('\\"', '"')
            def literal = groovy.json.JsonOutput.toJson(value)
            "        R.string.${row.attribute('name')} to ${literal}"
        }.join(',\n')
        def output = nativeCopyOutput.get().file('com/dogtracker/NativeCopy.kt').asFile
        output.parentFile.mkdirs()
        output.text = """package com.dogtracker

// Generated from values/strings.xml; Android reads resources, JVM tests use defaults.
object NativeCopy {
    @Volatile private var resources: android.content.res.Resources? = null
    fun install(value: android.content.res.Resources) { resources = value }
    private val defaults = mapOf(
${entries}
    )
    fun text(id: Int, vararg params: Any?): String {
        val template = resources?.getString(id) ?: defaults.getValue(id)
        var at = 0
        return Regex("\\\\{\\\\{[^{}]+\\\\}\\\\}").replace(template) {
            params[at++].toString()
        }
    }
}
"""
    }
}
android.sourceSets.main.java.srcDir(nativeCopyOutput.get().asFile)
tasks.named('preBuild').configure { dependsOn(generateNativeCopy) }

android.sourceSets.test.resources.srcDir(rootProject.file("../src/i18n"))
