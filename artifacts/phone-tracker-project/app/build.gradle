plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def local = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { local.load(it) }
def mapsKey = System.getenv('GOOGLE_MAPS_ANDROID_API_KEY') ?: local.getProperty('GOOGLE_MAPS_ANDROID_API_KEY', '')
android {
    namespace 'com.phonetracker'
    compileSdk 37
    defaultConfig {
        applicationId 'com.phonetracker'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        manifestPlaceholders.googleMapsApiKey = mapsKey
        buildConfigField 'boolean', 'GOOGLE_MAPS_CONFIGURED', (!mapsKey.trim().isEmpty()).toString()
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        development { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release { signingConfig signingConfigs.development; minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.gms:play-services-maps:19.1.0'
    testImplementation 'junit:junit:4.13.2'
}
